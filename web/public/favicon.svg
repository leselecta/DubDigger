<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The accent mark on the site's own ground: a square, turned, running off the
    top and right edges so only the wedge lands in frame. The export drew it as
    a full rotated square outside the viewBox held back by a mask; the path here
    is that same shape already cut to what shows, which is why nothing masks it.
  -->
  <rect width="32" height="32" fill="#060606" />
  <path d="M25.5 0 16 10.48 32 24.98 32 0Z" fill="#6fcabd" />
</svg>
